<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" width="640" height="140" role="img" aria-label="Tokens stream out of a model; a keyed detector marks each one as watermarked">
  <title>ai-text-watermark: keyed tokens, keyed detection</title>
  <rect width="640" height="140" rx="12" fill="#0f172a"/>
  <text x="20" y="30" fill="#e2e8f0" font-family="ui-monospace,monospace" font-size="14">LLM tokens → Watermarker(key) → detect(key)</text>
  <g font-family="ui-monospace,monospace" font-size="13">
    <g>
      <rect x="20" y="55" width="80" height="34" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="38" y="77" fill="#cbd5e1">The</text>
      <rect x="110" y="55" width="80" height="34" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="124" y="77" fill="#cbd5e1">model</text>
      <rect x="200" y="55" width="80" height="34" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="214" y="77" fill="#cbd5e1">wrote</text>
      <rect x="290" y="55" width="80" height="34" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="308" y="77" fill="#cbd5e1">this</text>
      <rect x="380" y="55" width="80" height="34" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="394" y="77" fill="#cbd5e1">text.</text>
    </g>
    <rect x="20" y="55" width="0" height="34" rx="6" fill="#22c55e" fill-opacity="0.25">
      <animate attributeName="width" values="0;440;440;0" keyTimes="0;0.6;0.9;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="20" cy="110" r="5" fill="#22c55e">
      <animate attributeName="cx" values="20;460;460;20" keyTimes="0;0.6;0.9;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="490" y="77" fill="#22c55e" opacity="0">✓ watermarked
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.6;0.9;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="490" y="118" fill="#94a3b8" font-size="11">p &lt; 1e-6, same key</text>
  </g>
</svg>
