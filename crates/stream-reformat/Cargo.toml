# stream-reformat — inflight LLM-stream reformatting (Google/OpenRouter/meta-llm)
# using the real `midstreamer-temporal-compare` for repetition detection.
# Self-contained [workspace] so it builds standalone and as wasm.
[package]
name = "stream-reformat"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Inflight LLM token-stream reformatting (separate thinking, collapse repetition, normalize) for Google Vertex / OpenRouter / meta-llm, built on ruvnet/midstream temporal-compare. Rust core + optional WASM."
repository = "https://github.com/ruvnet/ai-text-watermark"
homepage = "https://ruvnet.github.io/ai-text-watermark/"
keywords = ["llm", "streaming", "midstream", "reformat", "wasm"]
categories = ["text-processing", "wasm"]

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midstreamer-temporal-compare = "0.2"
wasm-bindgen = { version = "0.2", optional = true }

[profile.release]
opt-level = "z"
lto = true
